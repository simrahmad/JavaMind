<!DOCTYPE html>
<html>
<head>
    <title>My Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { background: white; width: 700px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #4a90e2; color: white; padding: 20px; text-align: center; font-size: 22px; }
        .chatbox { height: 450px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .user-msg { align-self: flex-end; background: #4a90e2; color: white; padding: 10px 15px; border-radius: 18px 18px 0 18px; max-width: 70%; }
        .bot-msg { align-self: flex-start; background: #e9e9e9; color: black; padding: 10px 15px; border-radius: 18px 18px 18px 0; max-width: 70%; }
        .input-area { display: flex; padding: 15px; gap: 10px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; font-size: 15px; outline: none; }
        .send-btn { background: #4a90e2; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 15px; }
        .clear-btn { background: #e74c3c; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">🤖 My Java Chatbot</div>
    <div class="chatbox" id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="send-btn" onclick="sendMessage()">Send</button>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user-msg');
        input.value = '';

        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userMessage: message })
        });

        const reply = await response.text();
        addMessage(reply, 'bot-msg');
    }

    function addMessage(text, className) {
        const chatbox = document.getElementById('chatbox');
        const div = document.createElement('div');
        div.className = className;
        div.textContent = text;
        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function clearChat() {
        await fetch('/clear', { method: 'POST' });
        document.getElementById('chatbox').innerHTML = '';
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
